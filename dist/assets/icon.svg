<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <!-- Background Gradient: Stadium Midnight Pitch -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#064E3B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 1px Specular Bevel with Gold tint -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Malachite Base Inset -->
    <linearGradient id="malachite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Hero Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#022C22" flood-opacity="0.75"/>
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FDE047" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>
  <g transform="translate(-102.400 -102.400) scale(1.4)">
<g filter="url(#shadow)">
    <!-- Victory Star Above Trophy -->
    <path d="M 256, 110 L 263, 126 L 280, 128 L 267, 140 L 271, 157 L 256, 148 L 241, 157 L 245, 140 L 232, 128 L 249, 126 Z"
          fill="#FEF08A" filter="url(#starGlow)"/>

    <!-- FIFA World Cup Trophy Silhouette -->
    <!-- Globe at the top (Radius 44, Center 256, 210) -->
    <circle cx="256" cy="210" r="44" fill="url(#trophyGold)"/>
    <!-- Globe Latitude / Longitude lines -->
    <ellipse cx="256" cy="210" rx="44" ry="16" fill="none" stroke="#78350F" stroke-width="2.5" stroke-opacity="0.5"/>
    <ellipse cx="256" cy="210" rx="20" ry="44" fill="none" stroke="#78350F" stroke-width="2.5" stroke-opacity="0.4"/>

    <!-- Two Spiraling Human/Wing Figures Uplifting the Globe -->
    <!-- Left spiral figure -->
    <path d="M 226, 348
             C 220, 310 200, 275 220, 235
             C 228, 220 240, 224 246, 238
             C 238, 260 240, 290 244, 348 Z"
          fill="url(#trophyGold)"/>
    <!-- Right spiral figure -->
    <path d="M 286, 348
             C 292, 310 312, 275 292, 235
             C 284, 220 272, 224 266, 238
             C 274, 260 272, 290 268, 348 Z"
          fill="url(#trophyGold)"/>

    <!-- Center Trophy Stem Core -->
    <path d="M 240, 270 Q 256, 285 272, 270 L 272, 348 L 240, 348 Z" fill="url(#trophyGold)"/>

    <!-- Pedestal Base (Stepped circular pedestal with malachite rings) -->
    <!-- Base Top Step -->
    <rect x="216" y="348" width="80" height="8" rx="3" fill="url(#trophyGold)"/>
    <!-- Upper Malachite Band -->
    <rect x="210" y="356" width="92" height="6" fill="url(#malachite)"/>
    <!-- Lower Gold Tier -->
    <rect x="206" y="362" width="100" height="8" fill="url(#trophyGold)"/>
    <!-- Lower Malachite Band -->
    <rect x="202" y="370" width="108" height="6" fill="url(#malachite)"/>
    <!-- Plinth Foot -->
    <rect x="196" y="376" width="120" height="10" rx="4" fill="url(#trophyGold)"/>
  </g>
  </g>
</svg>